run:
  timeout: 5m
  tests: true

linters:
  enable:
    - gofmt
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - gofumpt

linters-settings:
  govet:
    check-shadowing: true
  gofmt:
    simplify: true
  gofumpt:
    extra-rules: true

issues:
  exclude-use-default: false
  max-per-linter: 0
  max-same-issues: 0

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

version: "1.54.2"  # Use latest stable version
